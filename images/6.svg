<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="seaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="500" height="500" fill="url(#seaSky)"/>

  <!-- Sun -->
  <circle cx="90" cy="110" r="50" fill="#FDE047" opacity="0.9"/>

  <!-- Clouds -->
  <ellipse cx="320" cy="90" rx="40" ry="16" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="340" cy="80" rx="30" ry="20" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="370" cy="90" rx="25" ry="14" fill="#FFFFFF" opacity="0.8"/>

  <!-- Sea Ocean -->
  <path d="M 0 250 L 500 250 L 500 500 L 0 500 Z" fill="url(#seaGrad)"/>

  <!-- Waves -->
  <path d="M 0 270 Q 70 260 140 270 T 280 270 T 420 270 T 500 270 L 500 500 L 0 500 Z" fill="#0EA5E9" opacity="0.7"/>
  <path d="M 0 310 Q 90 300 180 310 T 360 310 T 500 310" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>

  <!-- Sandy Shore -->
  <path d="M 0 340 Q 150 320 300 350 Q 420 370 500 350 L 500 500 L 0 500 Z" fill="#FDE68A"/>
  <path d="M 0 390 Q 200 360 380 400 Q 460 410 500 400 L 500 500 L 0 500 Z" fill="#FCD34D"/>

  <!-- Beach Umbrella -->
  <g transform="translate(180, 360) rotate(12)">
    <!-- Pole -->
    <line x1="0" y1="0" x2="0" y2="80" stroke="#78350F" stroke-width="4"/>
    <!-- Canopy -->
    <path d="M -60 0 A 60 45 0 0 1 60 0 Z" fill="#F43F5E"/>
    <path d="M -30 0 A 60 45 0 0 1 30 0 Z" fill="#FFF1F2"/>
    <path d="M -10 0 A 60 45 0 0 1 10 0 Z" fill="#F43F5E"/>
  </g>

  <!-- Seashell on beach -->
  <g transform="translate(360, 420)">
    <path d="M 0 0 C -15 -20 15 -20 0 0 Z" fill="#F472B6"/>
    <circle cx="15" cy="5" r="4" fill="#FBCFE8"/>
  </g>

  <text x="250" y="475" font-family="'Caveat', cursive, sans-serif" font-size="28" fill="#78350F" text-anchor="middle" font-weight="bold">Sunny days &amp; ocean waves 🌊🏖️</text>
</svg>