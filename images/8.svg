<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="mem2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E8E4"/>
      <stop offset="100%" stop-color="#D8E2DC"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#mem2Bg)"/>

  <!-- Fairy lights string across top -->
  <path d="M 0 40 Q 150 90 300 40 Q 450 90 600 40" fill="none" stroke="#7F5539" stroke-width="2"/>
  <circle cx="80" cy="62" r="8" fill="#FFF3B0"/>
  <circle cx="150" cy="73" r="8" fill="#FFE5D9"/>
  <circle cx="230" cy="60" r="8" fill="#FFF3B0"/>
  <circle cx="320" cy="46" r="8" fill="#FFE5D9"/>
  <circle cx="400" cy="65" r="8" fill="#FFF3B0"/>
  <circle cx="480" cy="72" r="8" fill="#FFE5D9"/>

  <!-- Open notebook on desk -->
  <g transform="translate(180, 200) rotate(-4)">
    <rect x="-90" y="-60" width="180" height="120" rx="8" fill="#FAF0CA" stroke="#D4A373" stroke-width="3"/>
    <!-- Notebook spine -->
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#CCD5AE" stroke-width="4"/>
    <!-- Lines in notebook -->
    <line x1="-75" y1="-35" x2="-15" y2="-35" stroke="#E9D8A6" stroke-width="2"/>
    <line x1="-75" y1="-15" x2="-15" y2="-15" stroke="#E9D8A6" stroke-width="2"/>
    <line x1="-75" y1="5" x2="-15" y2="5" stroke="#E9D8A6" stroke-width="2"/>
    <line x1="-75" y1="25" x2="-15" y2="25" stroke="#E9D8A6" stroke-width="2"/>

    <line x1="15" y1="-35" x2="75" y2="-35" stroke="#E9D8A6" stroke-width="2"/>
    <line x1="15" y1="-15" x2="75" y2="-15" stroke="#E9D8A6" stroke-width="2"/>
    <line x1="15" y1="5" x2="75" y2="5" stroke="#E9D8A6" stroke-width="2"/>
    <!-- Doodled heart -->
    <path d="M 45 25 C 40 20 30 22 33 30 C 37 36 45 42 45 42 C 45 42 53 36 57 30 C 60 22 50 20 45 25 Z" fill="#E76F51"/>
  </g>

  <!-- Laptop & Tea Mug -->
  <g transform="translate(420, 200)">
    <!-- Laptop screen -->
    <rect x="-80" y="-70" width="120" height="80" rx="6" fill="#4A4E69"/>
    <rect x="-74" y="-64" width="108" height="68" rx="4" fill="#9A8C98"/>
    <!-- Screen heart / video call -->
    <circle cx="-20" cy="-30" r="16" fill="#F2E9E4"/>
    <circle cx="-20" cy="-35" r="7" fill="#C9ADA7"/>
    <ellipse cx="-20" cy="-18" rx="12" ry="6" fill="#C9ADA7"/>
    <!-- Laptop base -->
    <polygon points="-90,14 50,14 40,24 -80,24" fill="#6C757D"/>
    <!-- Tea Mug -->
    <rect x="55" y="-10" width="35" height="40" rx="5" fill="#E29578"/>
    <path d="M 90 -2 C 102 -2 102 20 90 20" fill="none" stroke="#E29578" stroke-width="4"/>
  </g>

  <text x="300" y="345" font-family="'Caveat', cursive, sans-serif" font-size="26" fill="#4A4E69" text-anchor="middle">"3:00 AM study sessions turned into gossip hours."</text>
</svg>